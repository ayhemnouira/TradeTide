<div
  @fadeIn
  class="max-w-md w-full bg-gray-900/40 backdrop-filter backdrop-blur-3xl rounded-3xl shadow-2xl overflow-hidden border border-green-500/20 relative"
>
  <div
    class="absolute inset-0 bg-gradient-to-tr from-green-600/10 via-emerald-500/10 to-teal-600/10 opacity-70 z-0"
  ></div>

  <div class="p-12 relative z-10">
    <h2
      class="text-4xl font-extrabold mb-10 text-center bg-gradient-to-r from-green-400 via-emerald-400 to-teal-400 text-transparent bg-clip-text drop-shadow-[0_2px_4px_rgba(0,255,128,0.3)]"
    >
      Welcome Back
    </h2>

    <form (ngSubmit)="handleLogin()" class="space-y-6">
      <!-- Success Message -->
      <div
        *ngIf="successMessage"
        class="flex items-center justify-center bg-green-900/30 border border-green-500/30 rounded-lg p-4 mb-4 shadow-[0_0_15px_rgba(34,197,94,0.2)] transition-all duration-300"
      >
        <ng-icon
          name="checkCircle"
          class="text-green-400 mr-2 text-xl"
        ></ng-icon>
        <p class="text-green-300 text-lg font-semibold text-center">
          {{ successMessage }}
        </p>
      </div>

      <div class="flex flex-col gap-4">
        <!-- Email -->
        <app-input
          icon="mail"
          type="email"
          placeholder="Email Address"
          [(ngModel)]="email"
          name="email"
          class="transition-all duration-300 hover:shadow-[0_0_15px_rgba(34,197,94,0.3)] rounded-lg"
        ></app-input>

        <!-- Password -->
        <app-input
          icon="lock"
          type="password"
          placeholder="Password"
          [(ngModel)]="password"
          name="password"
          class="transition-all duration-300 hover:shadow-[0_0_15px_rgba(34,197,94,0.3)] rounded-lg"
        ></app-input>
      </div>

      <!-- Forgot password -->
      <div
        class="flex items-center justify-between text-sm text-green-300 hover:text-green-200 font-medium hover:underline"
      >
        <a routerLink="/auth/forgot-password">Forgot password?</a>
      </div>

      <!-- Error -->
      <p
        *ngIf="error"
        class="text-red-400 font-medium text-center bg-red-900/20 px-4 py-2 rounded-lg shadow-inner"
      >
        {{ error }}
      </p>

      <!-- Login with Google -->
      <button
        type="button"
        (click)="loginWithGoogle()"
        class="w-full py-3 px-6 bg-white text-gray-700 font-semibold rounded-xl shadow-md hover:bg-gray-100 transition flex items-center justify-center gap-3"
      >
        <img
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt="Google logo"
          class="w-5 h-5"
        />
        <span>Continue with Google</span>
      </button>

      <!-- Normal Login Button -->
      <button
        @buttonHover
        type="submit"
        [disabled]="isLoading"
        class="w-full py-3 px-6 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold rounded-xl shadow-lg hover:from-green-600 hover:to-emerald-700 focus:outline-none focus:ring-4 focus:ring-green-400/40 focus:ring-offset-2 focus:ring-offset-gray-900 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <ng-icon
          *ngIf="isLoading"
          name="loader2"
          class="w-6 h-6 animate-spin mx-auto text-green-300"
        ></ng-icon>
        <span *ngIf="!isLoading" class="text-lg">Login</span>
      </button>
    </form>
  </div>

  <div
    class="px-12 py-6 bg-gray-950/20 flex justify-center border-t border-green-500/10 relative z-10"
  >
    <p class="text-sm text-gray-200">
      Don't have an account?
      <a
        routerLink="/auth/signup"
        class="text-green-300 font-medium hover:text-green-200 transition-colors duration-200 hover:underline"
        >Sign up</a
      >
    </p>
  </div>
</div>
