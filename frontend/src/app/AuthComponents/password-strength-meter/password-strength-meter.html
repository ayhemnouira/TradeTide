<div class="mt-2">
  <div class="h-2 bg-gray-700 rounded-full overflow-hidden">
    <div
      class="h-full transition-all duration-300"
      [ngClass]="{
            'bg-red-500': strength < 2,
            'bg-yellow-500': strength === 2,
            'bg-green-500': strength > 2,
            'w-1/4': strength === 1,
            'w-2/4': strength === 2,
            'w-3/4': strength === 3,
            'w-full': strength === 4
          }"
    ></div>
  </div>
  <p class="text-sm text-gray-400 mt-1">
    {{ strength === 0 ? 'Weak' : strength === 1 ? 'Weak' : strength === 2 ?
    'Fair' : strength === 3 ? 'Good' : 'Strong' }}
  </p>
</div>
