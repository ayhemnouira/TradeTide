<div
  @fadeIn
  class="max-w-md w-full bg-gray-900/40 backdrop-filter backdrop-blur-3xl rounded-3xl shadow-2xl overflow-hidden border border-green-500/20 relative"
>
  <div
    class="absolute inset-0 bg-gradient-to-tr from-green-600/10 via-emerald-500/10 to-teal-600/10 opacity-70 z-0"
  ></div>
  <div class="p-10 relative z-10">
    <h2
      class="text-3xl font-extrabold mb-6 text-center bg-gradient-to-r from-green-400 via-emerald-400 to-teal-400 text-transparent bg-clip-text drop-shadow-[0_2px_4px_rgba(0,255,128,0.3)]"
    >
      Reset Password
    </h2>

    <p
      *ngIf="error"
      class="text-red-400 font-medium mb-4 text-center bg-red-900/20 px-4 py-2 rounded-lg shadow-inner"
    >
      {{ error }}
    </p>
    <p
      *ngIf="message"
      class="text-green-400 font-medium mb-4 text-center bg-green-900/20 px-4 py-2 rounded-lg shadow-inner"
    >
      {{ message }}
    </p>

    <form (ngSubmit)="handleSubmit()" class="space-y-4" #resetForm="ngForm">
      <div class="flex flex-col gap-4">
        <!-- New Password -->
        <app-input
          icon="lock"
          type="password"
          placeholder="New Password"
          [(ngModel)]="password"
          name="password"
          [required]="true"
          class="transition-all duration-300 hover:shadow-[0_0_15px_rgba(34,197,94,0.3)] rounded-lg"
        ></app-input>
        <p
          *ngIf="resetForm.controls['password']?.errors?.['required'] && resetForm.controls['password']?.touched"
          class="text-red-400 text-sm mt-1"
        >
          New Password is required.
        </p>

        <!-- Confirm Password -->
        <app-input
          icon="lock"
          type="password"
          placeholder="Confirm New Password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          [required]="true"
          class="transition-all duration-300 hover:shadow-[0_0_15px_rgba(34,197,94,0.3)] rounded-lg"
        ></app-input>
        <p
          *ngIf="resetForm.controls['confirmPassword']?.errors?.['required'] && resetForm.controls['confirmPassword']?.touched"
          class="text-red-400 text-sm mt-1"
        >
          Confirm Password is required.
        </p>
      </div>

      <!-- Submit Button -->
      <button
        @buttonHover
        type="submit"
        [disabled]="isLoading || resetForm.invalid || password !== confirmPassword"
        class="relative w-full py-3 px-6 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold rounded-xl shadow-lg hover:from-green-600 hover:to-emerald-700 focus:outline-none focus:ring-4 focus:ring-green-400/40 focus:ring-offset-2 focus:ring-offset-gray-900 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed overflow-hidden group"
      >
        <span
          class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
        ></span>
        <ng-icon
          *ngIf="isLoading"
          name="loader2"
          class="w-5 h-5 animate-spin mx-auto relative z-10 text-green-300"
        ></ng-icon>
        <span *ngIf="!isLoading" class="relative z-10 text-base"
          >Set New Password</span
        >
      </button>
    </form>
  </div>
</div>
