<div
  @fadeIn
  class="max-w-md w-full bg-gray-900/40 backdrop-filter backdrop-blur-3xl rounded-3xl shadow-2xl overflow-hidden border border-green-500/20 relative"
>
  <!-- Background gradient overlay -->
  <div
    class="absolute inset-0 bg-gradient-to-tr from-green-600/10 via-emerald-500/10 to-teal-600/10 opacity-70 z-0"
  ></div>

  <!-- Content -->
  <div class="p-10 relative z-10">
    <h2
      class="text-3xl font-extrabold mb-6 text-center bg-gradient-to-r from-green-400 via-emerald-400 to-teal-400 text-transparent bg-clip-text drop-shadow-[0_2px_4px_rgba(0,255,128,0.3)]"
    >
      Forgot Password
    </h2>

    <div *ngIf="!isSubmitted; else submitted">
      <form (ngSubmit)="handleSubmit()" class="space-y-6" #forgotForm="ngForm">
        <p class="text-gray-200 text-sm text-center">
          Enter your email address and we'll send you a link to reset your
          password.
        </p>

        <!-- Email input -->
        <div class="flex flex-col gap-2">
          <app-input
            icon="mail"
            type="email"
            placeholder="Email Address"
            [(ngModel)]="email"
            name="email"
            [required]="true"
            pattern="^[a-zA-Z0-9._%+-]+&#64;gmail\.com$"
            class="transition-all duration-300 hover:shadow-[0_0_15px_rgba(34,197,94,0.3)] rounded-lg"
          >
            <ng-icon
              name="mail"
              class="absolute left-4 top-1/2 transform -translate-y-1/2 text-green-400 group-hover:text-green-300 transition-colors duration-200"
            ></ng-icon>
          </app-input>
          <p
            *ngIf="forgotForm.controls['email']?.errors?.['required'] && forgotForm.controls['email']?.touched"
            class="text-red-400 text-sm"
          >
            Email is required.
          </p>
          <p
            *ngIf="forgotForm.controls['email']?.errors?.['pattern'] && forgotForm.controls['email']?.touched"
            class="text-red-400 text-sm"
          >
            Please enter a valid email (e.g., example&#64;gmail.com).
          </p>
        </div>

        <!-- Submit button -->
        <button
          @buttonHover
          type="submit"
          [disabled]="isLoading || forgotForm.invalid"
          class="relative w-full py-3 px-6 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold rounded-xl shadow-lg hover:from-green-600 hover:to-emerald-700 focus:outline-none focus:ring-4 focus:ring-green-400/40 focus:ring-offset-2 focus:ring-offset-gray-900 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed overflow-hidden group"
        >
          <span
            class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
          ></span>
          <ng-icon
            *ngIf="isLoading"
            name="loader2"
            class="w-5 h-5 animate-spin mx-auto relative z-10 text-green-300"
          ></ng-icon>
          <span *ngIf="!isLoading" class="relative z-10 text-base"
            >Send Reset Link</span
          >
        </button>
      </form>
    </div>

    <!-- Submitted Message -->
    <ng-template #submitted>
      <div class="text-center mt-6">
        <div
          @iconPop
          class="w-14 h-14 bg-green-500/80 rounded-full flex items-center justify-center mx-auto mb-3 shadow-[0_0_15px_rgba(34,197,94,0.5)]"
        >
          <ng-icon name="mail" class="h-6 w-6 text-white"></ng-icon>
        </div>
        <p class="text-gray-200 text-sm">
          If an account exists for {{ email }}, you will receive a password
          reset link shortly.
        </p>
      </div>
    </ng-template>
  </div>

  <!-- Footer -->
  <div
    class="px-10 py-4 bg-gray-950/20 flex justify-center border-t border-green-500/10 relative z-10"
  >
    <a
      routerLink="/login"
      class="text-sm text-green-300 hover:text-green-200 font-medium transition-colors duration-200 hover:underline flex items-center"
    >
      <ng-icon name="arrowLeft" class="h-4 w-4 mr-2 text-green-300"></ng-icon>
      Back to Login
    </a>
  </div>
</div>
