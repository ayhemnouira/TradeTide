<div
  class="min-h-screen bg-gray-900 flex flex-col items-center justify-center p-4"
>
  <div
    class="max-w-2xl w-full bg-gray-800/50 backdrop-filter backdrop-blur-xl rounded-2xl shadow-xl p-8 border border-green-500/20"
  >
    <h1
      class="text-3xl font-bold text-center bg-gradient-to-r from-green-400 to-teal-400 text-transparent bg-clip-text mb-6"
    >
      Welcome to Your Home Page
    </h1>
    <p class="text-gray-200 text-center mb-8">
      You have successfully logged in! Explore your dashboard or manage your
      account.
    </p>
    <div class="flex justify-center space-x-4">
      <button
        (click)="logout()"
        class="py-2 px-6 bg-gradient-to-r from-red-500 to-red-600 text-white font-semibold rounded-lg shadow-md hover:from-red-600 hover:to-red-700 transition-all duration-300"
      >
        Log Out
      </button>
    </div>
  </div>
</div>
